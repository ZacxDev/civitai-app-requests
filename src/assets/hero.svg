<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="App Requests">
  <!--
    PLACEHOLDER HERO for the App Requests block.

    🔴 To swap the hero, replace THIS FILE. Nothing else references the artwork:
    `src/hero.ts` imports this one path and `<Hero>` renders whatever it gets.
    Keep the 3:1 viewBox (960x320) or the band will letterbox.

    Deliberately NOT generated with `civitai generate` in this pass — that spends
    real Buzz and is being handled separately by the operator. This is drawn from
    the brand system alone: the hue is #F09800 and the motif is the app mark
    (an upward triangle) repeated as a rising vote tally.

    Self-contained and theme-neutral: it carries its own dark ground rather than
    borrowing a page colour, so it reads identically in light and dark.
  -->
  <defs>
    <linearGradient id="ar-hero-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241800"/>
      <stop offset="1" stop-color="#120E08"/>
    </linearGradient>
    <linearGradient id="ar-hero-brand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C97F00"/>
      <stop offset="1" stop-color="#F09800"/>
    </linearGradient>
    <radialGradient id="ar-hero-glow" cx="0.22" cy="0.85" r="0.9">
      <stop offset="0" stop-color="#F09800" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F09800" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="320" fill="url(#ar-hero-ground)"/>
  <rect width="960" height="320" fill="url(#ar-hero-glow)"/>

  <!-- A rising tally of the app mark: each column one step taller, the tallest lit. -->
  <g transform="translate(96 250)">
    <g opacity="0.28" fill="#F09800">
      <path d="M0 0 L28 -48 L56 0 Z"/>
      <path d="M84 0 L112 -72 L140 0 Z"/>
      <path d="M168 0 L196 -96 L224 0 Z"/>
    </g>
    <g opacity="0.55" fill="#F09800">
      <path d="M252 0 L280 -120 L308 0 Z"/>
      <path d="M336 0 L364 -144 L392 0 Z"/>
    </g>
    <path d="M420 0 L448 -172 L476 0 Z" fill="url(#ar-hero-brand)"/>
  </g>

  <!-- Baseline. -->
  <rect x="72" y="250" width="528" height="2" fill="#F09800" opacity="0.35"/>

  <!-- The mark, set large on the right as the anchor. -->
  <g transform="translate(700 88)">
    <rect width="144" height="144" rx="34" fill="#F09800"/>
    <path d="M72 38 L116 106 L28 106 Z" fill="#241800"/>
  </g>
</svg>
