# pnpm settings. (pnpm 11 reads settings from here, camelCase; the `pnpm` field
# in package.json is no longer read.)

# No settings are set here. pnpm 11's supply-chain defaults — notably the 24h
# `minimumReleaseAge` — apply unmodified, with no exemptions.
#
# A `minimumReleaseAgeExclude` has been added twice (`@civitai/sdk@0.2.0` in #21,
# `@civitai/sdk@0.7.0` in #24) and deleted twice (#22, #25) — both times because the
# window closed and the entry stopped doing anything. Prefer waiting the window out
# over adding a third: such an entry expires on the CLOCK, not on a version bump, and
# once inert it silently weakens the next reader's assumptions about what the gate
# still covers.
#
# 🔴 IF AN INSTALL IS REFUSED, NEVER SET `minimumReleaseAge: 0` — that removes the
# protection from every dependency forever, silently, for everyone after you, whereas
# waiting costs hours and an exclude costs one pinned version. If you must not wait,
# add a single `minimumReleaseAgeExclude` entry pinned to the exact `name@version`; a
# bare package name exempts every future release of it forever.
#
# Note which direction is the dangerous one: the gate is ON by DEFAULT, so the hazard
# is SETTING the value, never leaving it unset. `minimumReleaseAge` appears nowhere in
# this repo (`pnpm config get minimumReleaseAge` → `undefined`) and the 24h window
# still enforces — that is exactly why #24 needed an exclude at all. So deleting the
# key is safe and is the current state; writing `0` into it is the irreversible part.
