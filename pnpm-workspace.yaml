# pnpm settings. (pnpm 11 reads settings from here, camelCase; the `pnpm` field
# in package.json is no longer read.)

# No settings are set here. pnpm 11's supply-chain defaults — notably the 24h
# `minimumReleaseAge` — apply unmodified, with no exemptions. If you need to add a
# `minimumReleaseAgeExclude` for a freshly published first-party version, prefer
# waiting out the window: the entry is inert the moment the window closes and then
# silently weakens the next reader's assumptions.
