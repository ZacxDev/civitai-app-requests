# pnpm settings. (pnpm 11 reads settings from here, camelCase; the `pnpm` field
# in package.json is no longer read.)

# No settings are set here. pnpm 11's supply-chain defaults — notably the 24h
# `minimumReleaseAge` — apply unmodified, with no exemptions.
#
# A `minimumReleaseAgeExclude` has been added twice (`@civitai/sdk@0.2.0` in #21,
# `@civitai/sdk@0.7.0` in #24) and deleted twice (#22, #25) — both times
# because the window closed and the entry stopped doing anything. Prefer waiting the
# window out over adding a third: such an entry expires on the CLOCK, not on a
# version bump, and once inert it silently weakens the next reader's assumptions
# about what the gate still covers.
