# pnpm settings. (pnpm 11 reads settings from here, camelCase; the `pnpm` field
# in package.json is no longer read.)

# No settings are set here. pnpm 11's supply-chain defaults — notably the 24h
# `minimumReleaseAge` — apply unmodified, with no exemptions.
#
# A `minimumReleaseAgeExclude` has been added twice (`@civitai/sdk@0.2.0` in #21,
# `@civitai/sdk@0.7.0` in #24) and deleted twice (#22, #25) — both times because the
# window closed and the entry stopped doing anything. Prefer waiting the window out
# over adding a third: such an entry expires on the CLOCK, not on a version bump, and
# once inert it silently weakens the next reader's assumptions about what the gate
# still covers.
#
# 🔴 IF AN INSTALL IS REFUSED, NEVER SET `minimumReleaseAge: 0` — that removes the
# protection from every dependency forever, silently, for everyone after you, whereas
# waiting costs hours and an exclude costs one pinned version. If you must not wait,
# add a single `minimumReleaseAgeExclude` entry pinned to the exact `name@version`; a
# bare package name exempts every future release of it forever.
#
# Note which direction is the dangerous one: the 1440-minute (24h) default is built
# in, so the hazard is SETTING the value, not leaving it unset. `minimumReleaseAge` is
# not SET anywhere in this repo — absent from this file, `package.json` and `~/.npmrc`;
# `pnpm config get minimumReleaseAge` prints `undefined` on pnpm 11.25.0 with the cwd
# inside the repo — and the window still enforced on `pnpm install --frozen-lockfile`,
# which is why #24 needed an exclude at all.
#
# ⚠ One nuance, because the simple story is wrong in one direction: per
# pnpm.io/settings/dependency-resolution, `minimumReleaseAgeStrict` defaults to true
# only when `minimumReleaseAge` is set EXPLICITLY — the built-in 1440 default is
# NON-strict, meaning fresh resolution may fall back to a non-compliant version rather
# than fail. The hard failure we rely on is the `--frozen-lockfile` path: the lockfile
# pins one exact version, so a violating entry has nothing to fall back to. So "unset
# is safe" holds for THIS repo's CI, but do not generalise it — and note that deleting
# an explicitly-set `minimumReleaseAge` silently flips strict from true to false,
# keeping the window while dropping the hard failure. Writing `0` remains the one
# unambiguously destructive edit.
