<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      🔴 DARK FIRST, and that order is the decision, not a formatting choice.
      `color-scheme` resolves left-to-right against the viewer's preference, so
      `light dark` would paint the UA canvas LIGHT for a viewer with NO
      preference. This app's own `palette()` (src/brand.ts) already resolves an
      unknown/absent theme to DARK, so dark is what "we do not know yet" means
      everywhere in this app. Keep the two in step.
    -->
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231971c2'/></svg>" />
    <title>App Requests</title>
    <script>
      /* ───────────────────────────────────────────────────────────────────────
         BOOT THEME, resolved BEFORE first paint.

         Two consumers, one answer. This script records its result on
         `<html data-civitai-boot-theme>`; the stylesheet below paints off that
         attribute, and `bootThemeGuess()` in src/bootTheme.ts READS THE SAME
         ATTRIBUTE BACK so React's pre-`ready` commit paints the identical
         colour. Reading it back — rather than re-deriving it — is what makes
         "they agree" a fact instead of a hope.

         🔴 WHY REACT CANNOT JUST USE `useBlockContext().theme` HERE. The SDK's
         pre-init snapshot hardcodes `theme: 'light'`
         (@civitai/blocks-react dist/internal/transport.js, EMPTY_SNAPSHOT) and
         `useBlockContext` returns it unchanged, so before BLOCK_INIT that value
         is a SENTINEL, not a signal — indistinguishable from a host that really
         is light. Honouring it would paint every viewer light for the ~100ms
         until BLOCK_INIT lands: with the skeleton below dark, that is
         dark → light → dark, a NEW flash introduced at exactly the moment
         `bootSkeleton: true` removes the host's veil that used to hide it.

         🔴 THIS DUPLICATES `parseBlockInitFragment` FROM @civitai/app-sdk ON
         PURPOSE, and must not import it: the SDK arrives with the bundle, which
         is precisely what has not loaded yet. The duplication is a real drift
         risk, so it is pinned — src/bootFragment.test.ts extracts THIS script
         out of THIS file, runs it, and feeds the SDK's own
         `encodeBlockInitFragment` output through it.

         🔴 DIVERGENCE FROM THE generate-from-model REFERENCE, deliberate: every
         fallback here is DARK, not light. `palette()` (src/brand.ts) resolves an
         unknown/absent theme to DARK and the stylesheet below is dark-base with
         light only inside `@media (prefers-color-scheme: light)`. A light
         fallback would contradict the very file this script exists to support.

         🔴 KNOWN, DELIBERATE NARROWING vs the SDK: `URLSearchParams`
         percent-decodes and these regexes do not, so `theme=%64ark` and
         `civitai%2dblock=v1` are read by the SDK and ignored here. That
         direction is safe — it falls back to the OS guess, then to dark. The
         encoder never emits either form.

         Total: any malformed, absent, truncated or future-version fragment
         falls through rather than throwing.
         ─────────────────────────────────────────────────────────────────── */
      (function () {
        var t = 'dark';
        try {
          var h = (location.hash || '').replace(/^#/, '');
          var resolved = null;
          /* Read the FIRST `civitai-block` key and require exactly `v1`. An
             unknown version must degrade to "no fast path", never to a
             partially-trusted read.

             🔴 An unanchored `/civitai-block=v1/.test(h)` is WRONG and is the
             one way a copy like this diverges from the SDK in the DANGEROUS
             direction: on `#civitai-block=v2&civitai-block=v1&theme=light` the
             SDK reads the FIRST marker (`URLSearchParams.get`), sees `v2` and
             refuses — while an unanchored test finds the SECOND and accepts.
             Matching the first key reproduces the SDK's precedence. */
          var mk = /(^|&)civitai-block=([^&]*)/.exec(h);
          if (mk && mk[2] === 'v1') {
            /* Same first-key rule as the marker, for the same reason:
               `URLSearchParams.get` returns the FIRST `theme`, so
               `theme=blue&theme=dark` is `blue` to the SDK — invalid, hence no
               fast path. A regex that skipped the invalid one and matched the
               later valid one would accept what the SDK refuses, and paint a
               theme the host never asked for. Fixing only the marker key leaves
               this one with the identical defect. */
            var mt = /(^|&)theme=([^&]*)/.exec(h);
            if (mt && (mt[2] === 'dark' || mt[2] === 'light')) resolved = mt[2];
          }
          if (resolved) {
            t = resolved;
          } else {
            /* The OS guess, and note which way round it is asked: LIGHT is the
               positive case, dark is the default. `no-preference`, and any UA
               without the query at all, therefore lands on dark — the same way
               the stylesheet below resolves it, because light lives only inside
               `@media (prefers-color-scheme: light)` there too. */
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          }
        } catch (e) {
          t = 'dark';
        }
        try {
          document.documentElement.setAttribute('data-civitai-boot-theme', t);
        } catch (e) {
          /* Nothing left to do. src/bootTheme.ts falls back to the OS query and
             then to dark, so the app still agrees with the unattributed CSS. */
        }
      })();
    </script>
    <!--
      ─────────────────────────────────────────────────────────────────────────
      BOOT SKELETON — paints before any script, and is what `bootSkeleton: true`
      in block.manifest.json entitles the host to rely on.
      ─────────────────────────────────────────────────────────────────────────

      With `bootSkeleton: true` the full-page run host stands down its own
      loading treatment: no opaque branded veil, the iframe is `opacity: 1` from
      mount, and there is no reveal transition. The consequence is blunt — with
      that key set over an EMPTY `#root`, the viewer sees a blank iframe for the
      entire load, which is strictly worse than not opting in. So the markup in
      `#root` below is load-bearing, not decoration; `src/bootSkeleton.ts`
      implements the platform's blocking gate and `src/bootSkeleton.test.ts`
      runs it against this file on every `npm test`.

      Three properties this has to keep, all asserted:

      1. INLINE. No external stylesheet, no JS. An external sheet is a second
         round-trip that can land after the window this whole feature is about.
      2. DARK IS THE BASE. Light lives ONLY inside
         `@media (prefers-color-scheme: light)`. There is deliberately no
         `@media (prefers-color-scheme: dark)` block — one would invert the
         default for `no-preference` and for any UA without the query.
      3. THE COLOURS ARE THE APP'S OWN. Every hex below is copied from
         `src/brand.ts` (`LIGHT`/`DARK`) and `src/hero.ts`, and a test asserts
         the equality so the two cannot drift into a colour flash at handoff.

      Removal needs no code: `createRoot(container).render(...)` in
      src/main.tsx clears the container's existing children before its first
      commit. That is MEASURED in src/bootSkeleton.test.tsx against this very
      markup, not assumed — it is a React behaviour and does not generalise to
      other frameworks.
    -->
    <style>
      /* The app sets these in src/index.css, which arrives with the bundle —
         i.e. after this paint. Without them here the skeleton is inset by the
         UA's default 8px body margin and then jumps when the bundle lands. */
      html {
        /* The strong guarantee: independent of `color-scheme` support entirely.
           DARK.body from src/brand.ts. */
        background: #14110c;
      }

      body {
        margin: 0;
      }

      :root {
        color-scheme: dark light;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

        /* DARK — the base, unconditioned values. From DARK in src/brand.ts. */
        --ar-boot-body: #14110c;
        --ar-boot-surface: #1c1813;
        --ar-boot-surface-2: #262019;
        --ar-boot-border: #40362b;
      }

      @media (prefers-color-scheme: light) {
        html {
          background: #fffbf4;
        }

        :root {
          /* LIGHT in src/brand.ts. */
          --ar-boot-body: #fffbf4;
          --ar-boot-surface: #ffffff;
          --ar-boot-surface-2: #fdf3e3;
          --ar-boot-border: #e2d5bd;
        }
      }

      /* ---- the HOST's answer, when there is one, outranks the OS guess ----

         The two rules below are driven by `data-civitai-boot-theme`, which the
         inline script in <head> sets from the init fragment. They must exist in
         BOTH directions and they must both sit here, AFTER the media block:

           host dark  + OS light → the media block would paint light
           host light + OS dark  → the base rules would paint dark

         …and each of those is a repaint at BLOCK_INIT, i.e. the exact flash this
         whole file exists to remove. `:root[…]` is (0,2,0) against the media
         block's (0,1,0) and the base `html` rule's (0,0,1), so it wins on
         specificity in both directions rather than on source order alone.

         🔴 These are NOT a third palette. Every value is the same literal as the
         base rules / the light media block above, and `bootSkeleton.test.tsx`
         asserts each one against `palette()` in src/brand.ts, per region — so a
         palette change that misses one of the four copies goes red.

         🔴 The unconditioned base rules stay DARK-ONLY. A light value reachable
         without either the media query or an explicit `='light'` attribute would
         make dark stop being what "no information" means, which is the rule the
         whole file is built on. That is asserted structurally, not eyeballed. */
      :root[data-civitai-boot-theme='dark'] {
        color-scheme: dark;
        background: #14110c;

        --ar-boot-body: #14110c;
        --ar-boot-surface: #1c1813;
        --ar-boot-surface-2: #262019;
        --ar-boot-border: #40362b;
      }

      :root[data-civitai-boot-theme='light'] {
        color-scheme: light;
        background: #fffbf4;

        --ar-boot-body: #fffbf4;
        --ar-boot-surface: #ffffff;
        --ar-boot-surface-2: #fdf3e3;
        --ar-boot-border: #e2d5bd;
      }

      /* ---- geometry ----

         Every value here is copied from the styles the first React commit
         paints, so the handoff is not a visible jump:

           page root  -> `pageStyle`     (src/theme.ts)
           well       -> `contentStyle`  (src/theme.ts): max-width 760,
                         padding clamp(14px, 3vw, 24px), margin 0 auto
           stack gap  -> `<Stack gap={18}>` in src/App.tsx
           hero       -> `<Hero>`: overlay min-height 116 + 1px border each side
                         = 118, radius `radius.lg` (14px), band ink
                         HERO_BAND_INK — fixed dark in BOTH themes, so the
                         skeleton hero is too
           toolbar    -> the first commit's toolbar holds only <SortToggle>
                         (SearchField and the count Badge are gated on
                         `visible.length > 0`, which is 0 while loading): a
                         `size="sm"` SegmentedControl, 24px segments + 3px
                         padding each side = 30px, right-aligned
           list gap   -> `<Stack gap={10}>` around the rows */

      [data-boot-skeleton] {
        box-sizing: border-box;
        width: 100%;
        min-height: 100dvh;
        background: var(--ar-boot-body);
      }

      [data-boot-skeleton] [data-boot-well] {
        box-sizing: border-box;
        margin: 0 auto;
        width: 100%;
        max-width: 760px;
        padding: clamp(14px, 3vw, 24px);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      [data-boot-skeleton] [data-boot-hero] {
        box-sizing: border-box;
        height: 118px;
        border-radius: 14px;
        /* HERO_BAND_INK from src/hero.ts — the band is fixed dark in both
           themes because its text is fixed light. No light override. */
        background: #1c160e;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      [data-boot-skeleton] [data-boot-toolbar] {
        display: flex;
        justify-content: flex-end;
      }

      [data-boot-skeleton] [data-boot-sort] {
        box-sizing: border-box;
        display: block;
        width: 132px;
        height: 30px;
        border-radius: 10px;
        background: var(--ar-boot-surface-2);
        border: 1px solid var(--ar-boot-border);
      }

      [data-boot-skeleton] [data-boot-list] {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      [data-boot-skeleton] [data-boot-row] {
        box-sizing: border-box;
        height: 78px;
        border-radius: 10px;
        background: var(--ar-boot-surface);
        border: 1px solid var(--ar-boot-border);
      }

      /* A slow, low-amplitude breath so the boot state reads as "loading"
         rather than "this is the content". Honours the same reduced-motion
         contract the app's own motion helper enforces in JS. */
      @keyframes ar-boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.62;
        }
      }

      [data-boot-skeleton] [data-boot-hero],
      [data-boot-skeleton] [data-boot-sort],
      [data-boot-skeleton] [data-boot-row] {
        animation: ar-boot-pulse 1.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        [data-boot-skeleton] [data-boot-hero],
        [data-boot-skeleton] [data-boot-sort],
        [data-boot-skeleton] [data-boot-row] {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        `data-boot-skeleton` is an ATTRIBUTE, not a class: classes are mangled
        by CSS-modules / purge, an attribute survives the bundler and is
        deterministically greppable out of the built HTML. `aria-hidden` because
        the host already publishes `aria-busy` on the iframe element while this
        is on screen — an in-frame live region would announce a second time.

        It MUST stay a descendant of #root: a skeleton painted as a sibling is
        never replaced by React's render and stays on screen after mount.
      -->
      <div data-boot-skeleton aria-hidden="true">
        <div data-boot-well>
          <div data-boot-hero></div>
          <div data-boot-toolbar><span data-boot-sort></span></div>
          <div data-boot-list>
            <div data-boot-row></div>
            <div data-boot-row></div>
            <div data-boot-row></div>
            <div data-boot-row></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
